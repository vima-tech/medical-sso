name: medical-sso

services:
  postgres:
    image: docker.io/library/postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-keycloak}
      POSTGRES_USER: ${POSTGRES_USER:-keycloak}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres-change-me}
    volumes:
      - keycloak-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-keycloak} -d ${POSTGRES_DB:-keycloak}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.3
    # --features-disabled=admin 在引擎层面移除 Keycloak 自带的管理控制台，
    # 只保留 admin-api 供统一身份管理平台调用。认证内核不承担直接管理职能。
    command: ["start-dev", "--import-realm", "--features-disabled=admin"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:-admin-change-me}
      KC_DB: postgres
      KC_DB_URL_HOST: postgres
      KC_DB_URL_DATABASE: ${POSTGRES_DB:-keycloak}
      KC_DB_USERNAME: ${POSTGRES_USER:-keycloak}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres-change-me}
      KC_HEALTH_ENABLED: "true"
      # 全部对外地址走网关的 /auth 前缀，Keycloak 自身不对外暴露端口
      KC_HTTP_RELATIVE_PATH: /auth
      KC_HOSTNAME: ${SSO_PUBLIC_URL:-http://localhost:18081}/auth
      KC_PROXY_HEADERS: xforwarded
      KC_HOSTNAME_STRICT: "false"
    volumes:
      - ./deploy/keycloak/realm:/opt/keycloak/data/import:ro,Z
      - ./deploy/keycloak/themes:/opt/keycloak/themes:ro,Z
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  gateway:
    image: docker.io/library/nginx:alpine
    # 整套系统对外唯一的入口
    ports:
      - "${PLATFORM_PORT:-18081}:18081"
    volumes:
      - ./deploy/gateway/nginx.conf:/etc/nginx/nginx.conf:ro,Z
    depends_on:
      - keycloak
    restart: unless-stopped

volumes:
  keycloak-postgres:
