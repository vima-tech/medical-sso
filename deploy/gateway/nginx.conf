# 统一入口。对外只有这一个端口，Keycloak 不直接暴露。
#
# 路由：
#   /auth/  -> Keycloak（浏览器的登录页、令牌端点，以及平台调用的 Admin API）
#   /       -> 统一身份管理平台
#
# Keycloak 自带的管理控制台已在引擎层面关闭（--features-disabled=admin），
# 这里再挡一道 master Realm 的登录入口，双保险。

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    server_tokens off;

    log_format  main  '$remote_addr - $status "$request" -> $upstream_addr';
    access_log /dev/stdout main;

    upstream keycloak {
        server keycloak:8080;
    }

    # 平台与本容器共享网络命名空间（compose 里的 network_mode: service:gateway），
    # 所以这里直接走回环。平台不占用宿主端口，也不在容器网络上暴露。
    upstream platform {
        server 127.0.0.1:18082;
    }

    server {
        listen 18081;
        server_name _;

        # 上传和请求体按需放宽，登录表单很小，这里留余量
        client_max_body_size 8m;

        proxy_http_version 1.1;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $http_host;
        proxy_set_header X-Forwarded-Port  $server_port;

        # Keycloak 的 master Realm 只服务于它自带的控制台，本平台不使用，直接封死
        location /auth/realms/master/ {
            return 404;
        }

        # 控制台静态资源入口，引擎已关闭，这里再挡一次
        location /auth/admin/master/ {
            return 404;
        }

        # 认证内核：登录页、令牌端点、以及平台调用的 Admin API
        location /auth/ {
            proxy_pass http://keycloak;
        }

        # 统一身份管理平台
        location / {
            proxy_pass http://platform;
        }
    }
}
