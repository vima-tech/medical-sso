<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/shell :: head('审计记录')}"></head>
<body>
<div th:replace="~{admin/shell :: nav('audit')}"></div>

<main class="admin-main">
    <div th:replace="~{admin/shell :: flash}"></div>

    <section class="admin-heading">
        <div>
            <h1>审计记录</h1>
            <p>记录只读，管理员无法删改，保留 30 天后由系统自动清理。排查「谁在什么时候动了什么」用这里。</p>
        </div>
        <div class="stack-switch">
            <a th:href="@{/admin/audit(tab='login')}" th:classappend="${tab == 'login'} ? 'active' : ''">登录记录</a>
            <a th:href="@{/admin/audit(tab='admin')}" th:classappend="${tab == 'admin'} ? 'active' : ''">管理操作</a>
        </div>
    </section>

    <form class="searchbar" method="get" th:action="@{/admin/audit}" th:if="${tab == 'login'}">
        <input type="hidden" name="tab" value="login">
        <select name="type" onchange="this.form.submit()">
            <option value="" th:selected="${type == ''}">全部登录事件</option>
            <option value="LOGIN" th:selected="${type == 'LOGIN'}">仅登录成功</option>
            <option value="LOGIN_ERROR" th:selected="${type == 'LOGIN_ERROR'}">仅登录失败</option>
            <option value="LOGOUT" th:selected="${type == 'LOGOUT'}">仅退出登录</option>
            <option value="UPDATE_PASSWORD" th:selected="${type == 'UPDATE_PASSWORD'}">仅修改密码</option>
        </select>
        <span class="result-count" th:text="'最近 ' + ${#lists.size(entries)} + ' 条'">最近 0 条</span>
    </form>

    <table class="data-table">
        <thead>
        <tr>
            <th>时间</th>
            <th th:text="${tab == 'login'} ? '事件' : '操作'">事件</th>
            <th>人员</th>
            <th>来源 IP</th>
            <th th:text="${tab == 'login'} ? '失败原因' : '对象'">备注</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="e : ${entries}">
            <td th:text="${e.time()}">2026-09-02 10:00:00</td>
            <td th:text="${e.action()}">登录成功</td>
            <td th:text="${e.who()}">张三</td>
            <td th:text="${e.ip()}">10.0.0.1</td>
            <td th:text="${e.detail()}">-</td>
        </tr>
        </tbody>
    </table>

    <div class="empty-state" th:if="${#lists.isEmpty(entries)}">
        <strong>暂无记录</strong>
        <p th:if="${tab == 'login'}">发生登录、退出或改密后会出现在这里。</p>
        <p th:unless="${tab == 'login'}">在管理平台做过增删改后会出现在这里。</p>
    </div>
</main>
</body>
</html>
