<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/shell :: head('授权中心')}"></head>
<body>
<div th:replace="~{admin/shell :: nav('authorizations')}"></div>
<div th:replace="~{admin/shell :: confirm}"></div>

<main class="admin-main">
    <div th:replace="~{admin/shell :: flash}"></div>

    <section class="admin-heading">
        <div>
            <h1>授权中心</h1>
            <p>查看人员可访问的业务系统。勾选后保存即可生效；点列头可批量选择当前页人员。</p>
        </div>
        <button class="primary-button" type="submit" form="authorization-form"
                th:if="${!#lists.isEmpty(matrix.rows()) and !#lists.isEmpty(matrix.systems())}">保存授权</button>
    </section>

    <form class="searchbar" method="get" th:action="@{/admin/authorizations}">
        <select name="departmentId" onchange="this.form.submit()">
            <option value="">全部人员</option>
            <th:block th:each="org : ${organizations}">
                <optgroup th:label="${org.name()}">
                    <option th:each="dept : ${org.departments()}"
                            th:value="${dept.id()}"
                            th:text="${dept.name()} + '（' + ${dept.memberCount()} + ' 人）'"
                            th:selected="${dept.id() == departmentId}">内科</option>
                </optgroup>
            </th:block>
        </select>
        <span class="result-count" th:text="'共 ' + ${total} + ' 人 · ' + ${#lists.size(matrix.systems())} + ' 个业务系统'">
            共 0 人
        </span>
    </form>

    <form id="authorization-form" method="post" th:action="@{/admin/authorizations}">
        <input type="hidden" name="departmentId" th:value="${departmentId}">
        <input type="hidden" name="page" th:value="${page}">

        <p class="authorization-hint"
           th:if="${!#lists.isEmpty(matrix.rows()) and !#lists.isEmpty(matrix.systems())}">
            当前页显示 <strong th:text="${#lists.size(matrix.rows())}">20</strong> 人，保存只会调整本页人员的授权。
        </p>

        <div class="matrix-wrap" th:if="${!#lists.isEmpty(matrix.rows()) and !#lists.isEmpty(matrix.systems())}">
            <table class="data-table matrix">
                <thead>
                <tr>
                    <th>姓名</th>
                    <th>工号</th>
                    <th>科室</th>
                    <th class="sys-col" th:each="sys : ${matrix.systems()}">
                        <span th:text="${sys.name()}">住院系统</span>
                        <button type="button" class="link-button col-toggle"
                                th:attr="data-system=${sys.clientId()}">本页全选/取消</button>
                    </th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="row : ${matrix.rows()}">
                    <td>
                        <span th:text="${row.name() ?: row.username()}">张三</span>
                        <span class="tag warn" th:unless="${row.enabled()}">已停用</span>
                        <input type="hidden" name="visible" th:value="${row.userId()}">
                    </td>
                    <td th:text="${row.employeeNo() ?: '-'}">10086</td>
                    <td th:text="${row.departmentName() ?: '-'}">内科</td>
                    <td class="sys-col" th:each="sys : ${matrix.systems()}">
                        <input type="checkbox" name="granted"
                               th:value="${row.userId()} + ':' + ${sys.clientId()}"
                               th:attr="data-system=${sys.clientId()}"
                               th:checked="${row.granted(sys.clientId())}">
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <div class="empty-state" th:if="${#lists.isEmpty(matrix.systems())}">
            <strong>还没有已登记的业务系统</strong>
            <p>先在「业务系统」里登记，之后才能在这里授权。</p>
        </div>
        <div class="empty-state" th:if="${#lists.isEmpty(matrix.rows()) and !#lists.isEmpty(matrix.systems())}">
            <strong>该范围内没有人员</strong>
            <p>换一个科室，或先在「人员管理」里建档。</p>
        </div>

    </form>

    <div class="pager" th:if="${total > pageSize}">
        <a class="quiet-button" th:if="${page > 0}"
           th:href="@{/admin/authorizations(departmentId=${departmentId}, page=${page - 1})}">上一页</a>
        <span th:text="'第 ' + (${page} + 1) + ' / ' + ${totalPages} + ' 页'">第 1 / 1 页</span>
        <a class="quiet-button" th:if="${hasNext}"
           th:href="@{/admin/authorizations(departmentId=${departmentId}, page=${page + 1})}">下一页</a>
    </div>
</main>

<script>
    // 列头「本页全选/取消」：批量授权或收回当前页人员
    document.addEventListener('click', function (event) {
        var button = event.target.closest('.col-toggle');
        if (!button) {
            return;
        }
        var system = button.getAttribute('data-system');
        var boxes = document.querySelectorAll('input[type="checkbox"][data-system="' + system + '"]');
        var allChecked = Array.prototype.every.call(boxes, function (box) { return box.checked; });
        Array.prototype.forEach.call(boxes, function (box) { box.checked = !allChecked; });
    });
</script>
</body>
</html>
