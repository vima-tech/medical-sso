<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/shell :: head('业务系统')}"></head>
<body>
<div th:replace="~{admin/shell :: nav('subsystems')}"></div>
<div th:replace="~{admin/shell :: confirm}"></div>

<main class="admin-main">
    <section class="admin-heading">
        <div>
            <h1>已登记业务系统</h1>
            <p>登记后即可获得该系统专属的接入配置和代码。</p>
        </div>
        <a class="primary-button" th:href="@{/admin/subsystems/new}">登记新系统</a>
    </section>

    <table class="data-table">
        <thead>
        <tr>
            <th>系统名称</th>
            <th>系统编码</th>
            <th>访问地址</th>
            <th>接入方式</th>
            <th>登录保护</th>
            <th class="actions-col">操作</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="item : ${subsystems}">
            <td th:text="${item.name()}">住院系统</td>
            <td><code th:text="${item.clientId()}">his-web</code></td>
            <td th:text="${item.baseUrl() ?: '-'}">https://his.intra.example</td>
            <td th:text="${item.stackLabel()}">标准接入 · JDK 17</td>
            <td>
                <span class="tag ok" th:if="${item.pkceEnforced()}">已启用</span>
                <span class="tag warn" th:unless="${item.pkceEnforced()}">未启用</span>
            </td>
            <td class="actions-col">
                <a th:href="@{'/admin/subsystems/' + ${item.clientId()}}">管理</a>
                <a th:href="@{'/admin/subsystems/' + ${item.clientId()} + '/guide'}">对接文档</a>
                <a th:href="@{'/admin/subsystems/' + ${item.clientId()} + '/check'}">自检</a>
            </td>
        </tr>
        </tbody>
    </table>
    <div class="empty-state" th:if="${subsystems.isEmpty()}">
        <strong>还没有登记任何业务系统</strong>
        <p>点击右上角「登记新系统」开始。</p>
    </div>
</main>
</body>
</html>
